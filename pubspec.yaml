name: fan
version: 2.0.0+2
description: FAN - histórias interativas em chat e livros em capítulos.
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: NotoSymbols
      fonts:
        - asset: assets/fonts/NotoSymbols.ttf
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji.ttf
  assets:
    - assets/covers/
    - assets/branding/
    - assets/backgrounds/
    - assets/fonts/OFL-Sora.txt
    - assets/fonts/OFL-Roboto.txt
    - assets/fonts/OFL-NotoSymbols.txt
    - assets/fonts/OFL-NotoEmoji.txt
